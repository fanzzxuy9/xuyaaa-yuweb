<title>Music Guweh</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#121212;
    color:white;
    padding-bottom:110px;
}



.sidebar{
    width:100%;
    background:#080808;
    padding:20px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.sidebar h1{
    font-size:25px;
    margin-right:15px;
}

.nav{
    border:0;
    background:transparent;
    color:#aaa;
    padding:13px 18px;
    border-radius:10px;
    font-size:17px;
}

.nav.active,
.nav:hover{
    background:#252525;
    color:white;
}



.main{
    padding:25px 20px;
}



.search-box{
    width:100%;
    max-width:750px;
    height:55px;

    margin:auto;
    margin-bottom:30px;

    display:flex;
    align-items:center;

    background:#242424;
    border-radius:35px;

    padding:5px 8px 5px 20px;
}

.search-box span{
    font-size:22px;
    margin-right:10px;
}

.search-box input{
    flex:1;

    border:0;
    outline:none;

    background:transparent;

    color:white;

    font-size:17px;
}

.search-box input::placeholder{
    color:#999;
}

.search-box button{
    border:0;

    background:#1ed760;

    color:#000;

    font-weight:bold;

    font-size:16px;

    padding:13px 25px;

    border-radius:30px;
}



.hero{
    max-width:1000px;
    margin:auto;

    min-height:280px;

    border-radius:22px;

    padding:40px;

    display:flex;
    align-items:flex-end;

    background:
    radial-gradient(
        circle at 80% 20%,
        #6035c0,
        transparent 40%
    ),
    linear-gradient(
        135deg,
        #191919,
        #292929
    );
}

.hero p{
    color:#1ed760;
    font-weight:bold;
    font-size:17px;
    margin-bottom:15px;
}

.hero h2{
    font-size:42px;
    margin-bottom:15px;
}

.hero span{
    color:#bbb;
    font-size:18px;
}

/* SONGS */

.section{
    max-width:1000px;
    margin:45px auto;
}

.section h2{
    font-size:32px;
    margin-bottom:25px;
}

.song-grid{
    display:grid;

    grid-template-columns:
    repeat(
        auto-fill,
        minmax(170px,1fr)
    );

    gap:20px;
}

.song-card{
    background:#181818;

    padding:15px;

    border-radius:15px;

    cursor:pointer;

    transition:.2s;
}

.song-card:hover{
    background:#292929;
    transform:translateY(-3px);
}

.song-cover{
    width:100%;
    aspect-ratio:1;

    object-fit:cover;

    border-radius:10px;

    margin-bottom:12px;

    background:#333;
}

.song-title{
    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:6px;
}

.song-artist{
    color:#999;

    font-size:14px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}



.player{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:100px;

    background:#181818;

    border-top:1px solid #333;

    display:flex;

    align-items:center;

    padding:10px 20px;

    z-index:999;
}

.now-playing{
    width:30%;

    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;
}

.now-playing img{
    width:60px;
    height:60px;

    object-fit:cover;

    border-radius:6px;

    background:#333;
}

.now-playing div{
    min-width:0;
}

.now-playing strong,
.now-playing span{
    display:block;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.now-playing span{
    color:#999;

    font-size:13px;

    margin-top:5px;
}

.player-center{
    flex:1;

    max-width:600px;

    margin:auto;
}

.controls{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:25px;

    margin-bottom:5px;
}

.controls button{
    border:0;

    background:transparent;

    color:white;

    font-size:22px;
}

.play-button{
    width:40px;
    height:40px;

    border-radius:50%;

    background:white !important;

    color:black !important;

    font-size:18px !important;
}

.progress-area{
    display:flex;

    align-items:center;

    gap:8px;

    color:#aaa;

    font-size:11px;
}

.progress-area input{
    flex:1;
}

input[type="range"]{
    accent-color:#1ed760;
}

.volume{
    width:20%;

    display:flex;

    justify-content:flex-end;

    align-items:center;

    gap:8px;
}

.volume input{
    width:100px;
}



@media(max-width:700px){

    .sidebar{
        padding:15px;
    }

    .sidebar h1{
        width:100%;
        font-size:23px;
    }

    .main{
        padding:20px 15px;
    }

    .hero{
        min-height:230px;
        padding:25px;
    }

    .hero h2{
        font-size:32px;
    }

    .song-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .player{
        height:110px;
        padding:8px 10px;
        flex-wrap:wrap;
    }

    .now-playing{
        width:45%;
    }

    .now-playing img{
        width:48px;
        height:48px;
    }

    .player-center{
        width:55%;
    }

    .volume{
        display:none;
    }

    .progress-area{
        width:100%;
    }

}
.request-btn{
    display:flex;
    align-items:center;
    gap:10px;
}

.request-btn svg{
    flex-shrink:0;
}

.request-modal{
    display:none;
    position:fixed;
    inset:0;

    align-items:center;
    justify-content:center;

.request-box h2{

.request-box p{

.request-box input{
    width:100%;

    margin-bottom:12px;

    border:0;

    border-radius:10px;
    background:#292929;
    color:white;
    font-size:15px;
}

.request-box input::placeholder{

.send-request{
    width:100%;
    padding:14px;

    border-radius:25px;

    background:#1ed760;
    color:#000;

    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.close-request{
    position:absolute;

<audio id="audio"></audio>


<script>

const songs = [
    {
        title: "Dunia Yang Nanti",
        artist: "Raim Laode",
        audio: "Raim_Laode_Dunia_Yang_Nanti_KLICKAUD.mp3",
        cover: "duniayangnanti1.jpg"
    },
    
        {
        title: "Shape Of My Heart",
        artist: "backstreet boys",
        audio: "shape-of-my-heart.mp3",
        cover: "shapeofmyheart.jpeg"
    },
    
        {
        title: "about you",
        artist: "The 1975",
        audio: "about_you_by_the_1975_but_it_s_sped_up_and_reverbed_KLICKAUD.mp3",
        cover: "images (1).jpeg"
    },
    {
        title: "Teh hijau",
        artist: "Tulus",
        audio: "Teh_hijau_by_Tulus_KLICKAUD.mp3",
        cover: "images.jpeg"
    },
    {
        title: "Ada titik titik di ujung doa",
        artist: "Sal priadi",
        audio: "Ada_Titik_Titik_Diujung_Doa_KLICKAUD.mp3",
        cover: "images (2).jpeg"
    },
    {
        title: "Love Me Not",
        artist: "Ravyn Lenae",
        audio: "Love_Me_Not_KLICKAUD.mp3",
        cover: "images (3).jpeg"
    },
    {
        title: "Penjaga Hati",
        artist: "Nadhif Basamalah",
        audio: "nadhif_basalamah_penjaga_hati_KLICKAUD.mp3",
        cover: "images.png"
    },
    {
        title: "Bergema sampai selamanya",
        artist: "Nadhif Basamalah",
        audio: "Nadhif_Basalamah_bergema_sampai_selamanya_KLICKAUD.mp3",
        cover: "0x1900-000000-80-0-0.jpg"
    },

];

let currentSong = 0;

const audio =
document.getElementById("audio");

const songGrid =
document.getElementById("songGrid");

const playerCover =
document.getElementById("playerCover");

const playerTitle =
document.getElementById("playerTitle");

const playerArtist =
document.getElementById("playerArtist");

const playButton =
document.getElementById("playButton");

const progress =
document.getElementById("progress");

const volume =
document.getElementById("volume");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");

const searchInput =
document.getElementById("searchInput");

const sectionTitle =
document.getElementById("sectionTitle");



function displaySongs(list){
    
    playerCover.src = songs[0].cover;
playerTitle.textContent = songs[0].title;
playerArtist.textContent = songs[0].artist;

    songGrid.innerHTML="";


    list.forEach(song=>{

        const index =
        songs.indexOf(song);


        const card =
        document.createElement("div");

        card.className="song-card";


        card.innerHTML=`

        <img
        class="song-cover"
        src="${song.cover}"
        alt="${song.title}"
        >

        <div class="song-title">
        ${song.title}
        </div>

        <div class="song-artist">
        ${song.artist}
        </div>

        `;


        card.onclick=()=>{

            playSong(index);

        };


        songGrid.appendChild(card);

    });

}

function playSong(index){

    currentSong=index;

    const song=
    songs[currentSong];


    audio.src=
    song.audio;


    playerTitle.textContent=
    song.title;


    playerArtist.textContent=
    song.artist;


    playerCover.src=
    song.cover;


    audio.load();


    audio.play()
    .then(()=>{

     playButton.innerHTML=`
<svg viewBox="0 0 24 24">
<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>
</svg>
`;

    })
    .catch(error=>{

        console.log(
            "Gagal memutar:",
            error
        );

        alert(
            "MP3 tidak bisa diputar. Pastikan file ada di folder music."
        );

    });

}

function togglePlay(){

    if(!audio.src){
        playSong(0);
        return;
    }

    if(audio.paused){

        audio.play();
        setPlayIcon(true);

    }else{

        audio.pause();
        setPlayIcon(false);

    }
}


function setPlayIcon(playing){

    if(playing){

        playButton.innerHTML = `
        <svg viewBox="0 0 24 24">
            <path d="M7 5h4v14H7zM13 5h4v14h-4z"/>
        </svg>
        `;

    }else{

        playButton.innerHTML = `
        <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7L8 5z"/>
        </svg>
        `;

    }

}

function nextSong(){

    currentSong++;

    if(
        currentSong>=songs.length
    ){

        currentSong=0;

    }

    playSong(currentSong);

}




function previousSong(){

    if(audio.currentTime>3){

        audio.currentTime=0;

        return;

    }


    currentSong--;

    if(currentSong<0){

        currentSong=
        songs.length-1;

    }


    playSong(currentSong);

}




audio.addEventListener(
"timeupdate",
()=>{

    if(!audio.duration)return;


    progress.value=
    (audio.currentTime/
    audio.duration)*100;


    currentTime.textContent=
    formatTime(
        audio.currentTime
    );


    duration.textContent=
    formatTime(
        audio.duration
    );

});


progress.addEventListener(
"input",
()=>{

    if(!audio.duration)return;


    audio.currentTime=
    (progress.value/100)*
    audio.duration;

});




volume.addEventListener(
"input",
()=>{

    audio.volume=
    volume.value;

});


audio.volume=0.8;




audio.addEventListener(
"ended",
()=>{

    nextSong();

});




function searchMusic(){

    const query=
    searchInput.value
    .trim()
    .toLowerCase();


    if(!query){

        sectionTitle.textContent=
        "Lagu Saya";

        displaySongs(songs);

        return;

    }


    const results=
    songs.filter(song=>

        song.title
        .toLowerCase()
        .includes(query)

        ||

        song.artist
        .toLowerCase()
        .includes(query)

    );


    sectionTitle.textContent=
    "Hasil pencarian";


    displaySongs(results);

}




searchInput.addEventListener(
"keydown",
event=>{

    if(event.key==="Enter"){

        searchMusic();

    }

});



function focusSearch(){

    searchInput.focus();

}

function showHome() {
    searchInput.value = "";
    sectionTitle.textContent = "Lagu Saya";

    displaySongs(songs);

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}



function formatTime(seconds){

    if(isNaN(seconds)){

        return "0:00";

    }


    const minutes=
    Math.floor(seconds/60);


    const secs=
    Math.floor(seconds%60)
    .toString()
    .padStart(2,"0");


    return `${minutes}:${secs}`;

}



displaySongs(songs);
 function openRequest(){

    document.getElementById("requestModal").style.display = "flex";

}


function closeRequest(){

    document.getElementById("requestModal").style.display = "none";

}


function sendRequest(){

    const song = document.getElementById("requestSong").value.trim();
    const artist = document.getElementById("requestArtist").value.trim();

    if(!song){

        alert("Masukkan nama lagu terlebih dahulu!");
        return;

    }

    const message =
        `Request Lagu%0A%0ALagu: ${encodeURIComponent(song)}%0AArtis: ${encodeURIComponent(artist || "-")}`;
    const phone = "6285702505960";

    window.open(
        `https://wa.me/${phone}?text=${message}`,
        "_blank"
    );

}

const bgSettings =
    document.getElementById("backgroundSettings");

const bgInput =
    document.getElementById("bgInput");

const removeBg =
    document.getElementById("removeBg");

const closeBgSettings =
    document.getElementById("closeBgSettings");


function openBackgroundSettings() {
    bgSettings.classList.add("show");
}


closeBgSettings.onclick = function() {
    bgSettings.classList.remove("show");
};


bgSettings.onclick = function(event) {
    if (event.target === bgSettings) {
        bgSettings.classList.remove("show");
    }
};


bgInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        const image = event.target.result;

        document.body.style.setProperty(
            "--custom-background",
            `url("${image}")`
        );

        localStorage.setItem(
            "customBackground",
            image
        );
    };

    reader.readAsDataURL(file);
});


removeBg.onclick = function() {

    document.body.style.removeProperty(
        "--custom-background"
    );

    localStorage.removeItem(
        "customBackground"
    );

    bgInput.value = "";
};




const savedBackground =
    localStorage.getItem("customBackground");

if (savedBackground) {

    document.body.style.setProperty(
        "--custom-background",
        `url("${savedBackground}")`
    );
}
</script>

</body>
</html>
