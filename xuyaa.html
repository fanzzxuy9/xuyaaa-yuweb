<style>
  :root {
    --bg: #f7f3ec;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --line: #e6dfd4;
    --accent: #b8446a;
    --accent-dark: #8f3454;
    --topbar-bg: rgba(247, 243, 236, 0.88);
    --frame-bg: #eee6da;
    --hero-tag-bg: rgba(247, 243, 236, 0.95);
    --card-bg: #ffffff;
    --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }

  [data-theme="dark"] {
    --bg: #121212;
    --ink: #e0e0e0;
    --muted: #a0a0a0;
    --line: #333333;
    --accent: #d15b7d;
    --accent-dark: #b8446a;
    --topbar-bg: rgba(18, 18, 18, 0.88);
    --frame-bg: #222222;
    --hero-tag-bg: rgba(18, 18, 18, 0.95);
    --card-bg: #1e1e1e;
    --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.4s ease;
  }

  body.no-scroll { overflow: hidden; }

  .splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    display: grid;
    place-items: center;
    padding: 24px;
    transition: opacity .75s ease, transform .75s ease, visibility .75s ease, background 0.4s ease;
  }
  .splash.hide {
    opacity: 0;
    visibility: hidden;
    transform: scale(1.05);
    pointer-events: none;
  }

  .splash-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .splash-photo {
    position: relative;
    width: min(200px, 52vw);
    aspect-ratio: 1 / 1;
    border-radius: 26px;
    overflow: hidden;
    margin-bottom: 26px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
    opacity: 0;
    transform: translateY(18px) scale(.9);
    animation: splashIn .9s cubic-bezier(.2, .7, .2, 1) .15s forwards;
  }
  [data-theme="dark"] .splash-photo {
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }
  .splash-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(184, 68, 106, .35);
    pointer-events: none;
  }
  .splash-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @keyframes splashIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .splash-title {
    font-size: clamp(1.7rem, 6vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.2;
    color: var(--ink);
    min-height: 1.25em;
    transition: color 0.4s ease;
  }

  .splash-sub {
    margin-top: 6px;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
    min-height: 1.3em;
    transition: color 0.4s ease;
  }

  .typing::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: .95em;
    margin-left: 3px;
    vertical-align: -.1em;
    background: var(--accent);
    animation: blink .8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .topbar {
    position: sticky;
    top: 0;
    background: var(--topbar-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .brand { font-weight: 700; letter-spacing: -0.01em; font-size: 1rem; }
  .brand span { color: var(--accent); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .steps { display: flex; gap: 6px; }
  .step {
    width: 26px; height: 4px;
    border-radius: 2px;
    background: var(--line);
    transition: background 0.3s ease;
  }
  .step.active { background: var(--accent); }

  .theme-toggle {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    padding: 0;
  }
  .theme-toggle:hover {
    background: var(--line);
    transform: scale(1.05);
  }
  .theme-toggle svg {
    width: 18px;
    height: 18px;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .theme-toggle:hover svg {
    transform: rotate(15deg);
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .slide { animation: fade 0.5s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 64px;
    align-items: center;
    min-height: calc(100vh - 200px);
    padding: 24px 0 40px;
  }
  @media (max-width: 860px) {
    .hero {
      grid-template-columns: 1fr;
      gap: 40px;
      min-height: auto;
      padding: 8px 0 24px;
    }
  }

  .hero-text { position: relative; }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 28px;
  }
  .hero-eyebrow::before {
    content: "";
    width: 28px;
    height: 1px;
    background: var(--accent);
  }
  .hero-eyebrow .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .hero h1 {
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.02;
    margin-bottom: 24px;
    color: var(--ink);
    transition: color 0.4s ease;
  }
  .hero h1 em {
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    color: var(--accent);
    position: relative;
  }
  .hero h1 em::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    bottom: 4px;
    height: 6px;
    background: rgba(184, 68, 106, 0.15);
    z-index: -1;
    border-radius: 3px;
  }

  .hero-desc {
    font-size: 1.05rem;
    color: var(--muted);
    max-width: 440px;
    margin-bottom: 36px;
    line-height: 1.65;
    transition: color 0.4s ease;
  }

  .hero-actions {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .hero-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    transition: color 0.4s ease;
  }
  .hero-meta .sep {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--line);
  }

  .hero-visual {
    position: relative;
    aspect-ratio: 4 / 5;
    max-width: 440px;
    justify-self: end;
    width: 100%;
  }
  @media (max-width: 860px) {
    .hero-visual {
      justify-self: center;
      max-width: 340px;
    }
  }

  .hero-visual .frame {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    overflow: hidden;
    background: var(--frame-bg);
    box-shadow: 0 20px 50px rgba(28, 28, 28, 0.15);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  [data-theme="dark"] .hero-visual .frame {
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .hero-visual .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.8s ease;
  }
  .hero-visual:hover .frame img {
    transform: scale(1.04);
  }

  .hero-visual::before {
    content: "";
    position: absolute;
    top: -14px; left: -14px;
    width: 100px; height: 100px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
    border-radius: 20px 0 0 0;
    z-index: 2;
    pointer-events: none;
  }
  .hero-visual::after {
    content: "";
    position: absolute;
    bottom: -14px; right: -14px;
    width: 100px; height: 100px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    border-radius: 0 0 20px 0;
    z-index: 2;
    pointer-events: none;
  }

  .hero-tag {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    background: var(--hero-tag-bg);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    z-index: 3;
    transition: background 0.4s ease;
  }
  .hero-tag .name { font-weight: 600; color: var(--ink); }
  .hero-tag .role { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.05em; }

  .hero-counter {
    position: absolute;
    top: -14px; right: -14px;
    background: var(--ink);
    color: var(--bg);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    padding: 8px 14px;
    border-radius: 999px;
    z-index: 4;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 26px;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--bg);
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease, background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
  }
  .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); transform: translateY(-1px); }
  .btn .arrow {
    display: inline-block;
    transition: transform 0.25s ease;
  }
  .btn:hover .arrow { transform: translateX(4px); }

  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn.ghost:hover { background: var(--line); border-color: var(--ink); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.accent:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .profile {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 48px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .profile { grid-template-columns: 1fr; gap: 32px; }
  }

  .photo-col img {
    width: 100%;
    display: block;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    transition: box-shadow 0.4s ease;
  }
  [data-theme="dark"] .photo-col img {
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .photo-col img + img { margin-top: 16px; }
  .photo-col .caption {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    font-style: italic;
  }

  .info-col h2 {
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .info-col h1 {
    font-size: clamp(1.6rem, 3.5vw, 2.2rem);
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 20px;
  }
  .info-col p { color: var(--muted); margin-bottom: 14px; font-size: 0.98rem; }

  .section {
    border-top: 1px solid var(--line);
    padding-top: 24px;
    margin-top: 24px;
  }
  .section h3 {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 14px;
  }

  .kv {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 8px 16px;
    font-size: 0.92rem;
  }
  .kv dt { color: var(--muted); font-weight: 500; }
  .kv dd { color: var(--ink); }

  @media (max-width: 480px) {
    .kv { grid-template-columns: 1fr; gap: 2px 0; }
    .kv dd { margin-bottom: 10px; }
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    max-width: 480px;
    margin: 0 auto;
  }
  .empty h2 { font-size: 1.5rem; margin-bottom: 12px; }
  .empty p { color: var(--muted); margin-bottom: 28px; }

  .footer-nav {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .browse-section {
    padding: 12px 0 40px;
  }

  .browse-header {
    text-align: center;
    margin-bottom: 40px;
  }
  .browse-header h2 {
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
    color: var(--ink);
  }
  .browse-header p {
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto;
    font-size: 0.98rem;
  }

  .browse-block {
    margin-bottom: 56px;
  }
  .browse-block-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent);
  }
  .browse-block-title svg {
    width: 20px;
    height: 20px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .anime-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 24px;
  }
  @media (max-width: 480px) {
    .anime-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
  }

  .anime-card {
    background: var(--card-bg);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--card-shadow);
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid var(--line);
  }
  .anime-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
  }
  [data-theme="dark"] .anime-card:hover {
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  }

  .anime-card-img {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    background: var(--frame-bg);
  }
  .anime-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }
  .anime-card:hover .anime-card-img img {
    transform: scale(1.06);
  }

  .anime-card-score {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.75);
    color: #ffd700;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .anime-card-body {
    padding: 14px 16px 18px;
  }
  .anime-card-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .anime-card-meta {
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .anime-card-meta span {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .loading-spinner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 16px;
    color: var(--muted);
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error-box {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    background: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--line);
    margin: 20px 0;
  }
  .error-box p { margin-bottom: 16px; }

  .detail-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--accent);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 24px;
    transition: gap 0.2s ease;
  }
  .detail-back:hover {
    gap: 12px;
  }

  .detail-layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 48px;
    align-items: start;
  }
  @media (max-width: 768px) {
    .detail-layout {
      grid-template-columns: 1fr;
      gap: 32px;
    }
  }

  .detail-poster {
    position: sticky;
    top: 100px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
  }
  [data-theme="dark"] .detail-poster {
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  }
  .detail-poster img {
    width: 100%;
    display: block;
    aspect-ratio: 3 / 4;
    object-fit: cover;
  }
  @media (max-width: 768px) {
    .detail-poster {
      position: static;
      max-width: 280px;
      margin: 0 auto;
    }
  }

  .detail-info h1 {
    font-size: clamp(1.6rem, 3.5vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .detail-info .detail-jp-title {
    font-size: 0.95rem;
    color: var(--muted);
    margin-bottom: 20px;
    font-style: italic;
  }

  .detail-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--frame-bg);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .badge.score {
    background: rgba(255, 215, 0, 0.12);
    color: #b8860b;
    border-color: rgba(255, 215, 0, 0.3);
  }
  [data-theme="dark"] .badge.score {
    color: #ffd700;
  }
  .badge.type-badge {
    background: rgba(184, 68, 106, 0.1);
    color: var(--accent);
    border-color: rgba(184, 68, 106, 0.25);
  }

  .detail-synopsis {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.75;
    margin-bottom: 28px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  @media (max-width: 480px) {
    .detail-grid {
      grid-template-columns: 1fr;
    }

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query, variables }),
        signal: controller.signal
      });
      if (!res.ok) {
        if (res.status === 429) throw new Error('API sedang sibuk. Tunggu sebentar lalu coba lagi.');
        throw new Error('Gagal mengambil data anime (HTTP ' + res.status + ').');
      }
      const json = await res.json();
      if (json.errors && json.errors.length) throw new Error('API anime sedang bermasalah. Coba lagi nanti.');
      return json.data;

      if (err.name === 'AbortError') throw new Error('Koneksi timeout. Cek internet lalu coba lagi.');

  let currentGalleryCategory = 'waifu';

  async function fetchNekosBest(category, amount = 12) {
    const url = `https://nekos.best/api/v2/${category}?amount=${amount}`;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);

    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);

      if (!res.ok) {
        if (res.status === 404) throw new Error('Kategori tidak tersedia.');
        throw new Error('Gagal mengambil gambar (HTTP ' + res.status + ').');
      }

      const data = await res.json();

      if (!data.results || data.results.length === 0) {
        throw new Error('Tidak ada gambar untuk kategori ini.');
      }

      return data.results.map(item => ({
        url: item.url,
        artist: item.artist_name || '',
        source: item.source_url || ''
      }));
    } catch (err) {
      clearTimeout(timer);
      if (err.name === 'AbortError') throw new Error('Timeout. Cek internet kamu lalu coba lagi.');
      throw err;
    }
  }

  function typeInto(el, text, speed) {
    if (speed === undefined) speed = 95;
    return new Promise(resolve => {
      el.classList.add('typing');
      let i = 0;
      (function step() {
        el.textContent = text.slice(0, i + 1);
        i++;
        if (i < text.length) {
          setTimeout(step, speed);
        } else {
          el.classList.remove('typing');
          resolve();
        }
      })();
    });
  }

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function runSplash() {
    document.body.classList.add('no-scroll');

    if (!splashImg.complete) {
      await Promise.race([
        new Promise(r => { splashImg.onload = r; splashImg.onerror = r; }),
        wait(3000)
      ]);
    }

    await wait(650);
    await typeInto(titleEl, 'xuyaa', 120);
    await wait(180);
    await typeInto(subEl, 'xuyy dev', 90);
    await wait(950);

    splash.classList.add('hide');
    document.body.classList.remove('no-scroll');
    setTimeout(() => splash.remove(), 900);
  }

  function safeCssUrl(url) {
    return 'url("' + String(url).replace(/"/g, '%22').replace(/[\n\r]/g, '') + '")';
  }

  function renderBackground() {
    if (bgImageValue) {
      const a = (bgDimValue / 100).toFixed(2);

      document.body.style.backgroundImage =
        'linear-gradient(rgba(0,0,0,' + a + '), rgba(0,0,0,' + a + ')), ' + safeCssUrl(bgImageValue);

      document.body.style.backgroundImage = '';

      document.body.style.backgroundRepeat = '';
      document.body.style.backgroundAttachment = '';

      bgPreview.style.backgroundImage = '';
      bgPreview.innerHTML = '<span>Belum ada background</span>';

  function saveBackground() {
    try {
      if (bgImageValue) {
        localStorage.setItem(BG_IMG_KEY, bgImageValue);

  function setBgStatus(msg) {

      }, 2600);
    }
  }

  function fileToDataUrl(file, maxW) {
    maxW = maxW || 1920;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.naturalWidth;
          let h = img.naturalHeight;
          if (w > maxW) {
            h = Math.round(h * maxW / w);
            w = maxW;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          try {
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          } catch (e) {
            resolve(reader.result);
          }
        };
        img.onerror = () => reject(new Error('Gambar tidak bisa dibaca.'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('Gagal membaca file.'));
      reader.readAsDataURL(file);
    });
  }

  bgFile.addEventListener('change', async () => {
    const file = bgFile.files && bgFile.files[0];

    if (!file.type.startsWith('image/')) {

      bgFile.value = '';

    bgFileName.textContent = 'Memproses gambar…';
    try {
      const dataUrl = await fileToDataUrl(file, 1920);
      bgImageValue = dataUrl;
      bgFileName.textContent = file.name;
      renderBackground();
      const ok = saveBackground();
      setBgStatus(ok ? 'Background diterapkan ✓' : 'Diterapkan (gagal disimpan permanen)');
    } catch (err) {
      bgFileName.textContent = 'Pilih gambar dari galeri…';
      setBgStatus(err.message || 'Gagal memuat gambar.');

  (function initBackground() {
    try {

      if (savedDim !== null && !isNaN(Number(savedDim))) {

      }
      bgDimVal.textContent = bgDimValue + '%';
      if (savedImg) bgImageValue = savedImg;
    } catch (e) {}
    renderBackground();
  })();

  go(1);
  runSplash();
</script>
